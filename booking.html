<form id="bookingForm">

<input type="text" name="name" placeholder="Full Name" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<input type="email" name="email" placeholder="Email" required>

<select name="service">

<option>Basic Exterior Services</option>
<option>Basic Interior Services</option>
<option>Express Clean Tier 1</option>
<option>Deep Clean Tier 2</option>
<option>Premium Clean Tier 3</option>
<option>Platinum VIP Plan</option>
<option>Gold VIP Plan</option>

</select>

<select name="vehicle">

<option>Sedan</option>
<option>SUV</option>
<option>Pickup/Van</option>

</select>

<input type="date" name="date" required>

<input type="time" name="time" required>

<button type="submit">Book Appointment</button>

</form>

<p id="message"></p>

<script src="script.js"></script>

<input type="time" name="time" step="3600">
