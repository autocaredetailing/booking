<!DOCTYPE html>
<html>

<head>

<title>Book Appointment</title>

<style>

body{
font-family:Arial;
background:#050b18;
padding:40px;
color:white;
}

.container{
max-width:500px;
margin:auto;
background:#0d1628;
padding:35px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,150,255,0.25);
}

.logo{
display:block;
margin:auto;
width:220px;
margin-bottom:15px;
}

h1{
text-align:center;
color:#00aaff;
margin-bottom:20px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:12px;
border-radius:6px;
border:none;
font-size:14px;
}

input,select{
background:#f5f5f5;
}

button{
background:#00aaff;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#0088cc;
}

#message{
margin-top:15px;
text-align:center;
color:#00ffaa;
}

</style>

</head>

<body>

<div class="container">

<img src="logoo.png" class="logoo">

<h1>Book Appointment</h1>

<form id="bookingForm">

<input type="text" name="name" placeholder="Full Name" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<input type="email" name="email" placeholder="Email" required>

<select name="service">

<option value="Basic Exterior Services">Basic Exterior Services</option>
<option value="Basic Interior Services">Basic Interior Services</option>
<option value="Express Clean Tier 1">Express Clean "Tier 1"</option>
<option value="Deep Clean Tier 2">Deep Clean "Tier 2"</option>
<option value="Premium Clean Tier 3">Premium Clean "Tier 3"</option>
<option value="Platinum VIP Plan">Platinum VIP Plan</option>
<option value="Gold VIP Plan">Gold VIP Plan</option>

</select>

<select name="vehicle">

<option>Sedan</option>
<option>SUV</option>
<option>Pickup/Van</option>

</select>

<input type="date" name="date" required>

<input type="time" name="time" step="3600" required>

<button type="submit">Book Appointment</button>

</form>

<p id="message"></p>

</div>

<script src="script.js"></script>

</body>

</html>
