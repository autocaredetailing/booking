<!DOCTYPE html>
<html>

<head>

<title>Book Appointment</title>

<style>

body{
font-family:Arial;
background:#050b18;
padding:40px;
color:white;
}

.container{
max-width:520px;
margin:auto;
background:#0d1628;
padding:35px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,150,255,0.25);
}

.logo{
display:block;
margin:auto;
width:220px;
margin-bottom:15px;
}

h1{
text-align:center;
color:#00aaff;
margin-bottom:20px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:12px;
border-radius:6px;
border:none;
font-size:14px;
}

input,select{
background:#f5f5f5;
}

button{
background:#00aaff;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#0088cc;
}

#addons{
margin-top:10px;
background:#08101f;
padding:15px;
border-radius:8px;
display:none;
}

.addon-item{
margin-top:8px;
}

#priceBox{
margin-top:15px;
background:#08101f;
padding:15px;
border-radius:8px;
font-size:18px;
text-align:center;
color:#00ffaa;
}

#message{
margin-top:15px;
text-align:center;
color:#00ffaa;
}

</style>

</head>

<body>

<div class="container">

<img src="logoo.png" class="logo">

<h1>Book Appointment</h1>

<form id="bookingForm">

<input type="text" name="name" placeholder="Full Name" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<input type="email" name="email" placeholder="Email" required>

<select name="service" id="service">

<option value="Basic Exterior">Basic Exterior Services</option>
<option value="Basic Interior">Basic Interior Services</option>
<option value="Tier1">Express Clean "Tier 1"</option>
<option value="Tier2">Deep Clean "Tier 2"</option>
<option value="Tier3">Premium Clean "Tier 3"</option>
<option value="Platinum">Platinum VIP Plan</option>
<option value="Gold">Gold VIP Plan</option>

</select>

<select name="vehicle" id="vehicle">

<option value="Sedan">Sedan</option>
<option value="SUV">SUV</option>
<option value="Pickup">Pickup/Van</option>

</select>

<!-- OPTIONAL ADDONS -->

<div id="addons">

<h3>Optional Add-ons</h3>

<label class="addon-item">
<input type="checkbox" value="6000" class="addon"> Car Belt & Seat Cleaning ($6,000)
</label>

<label class="addon-item">
<input type="checkbox" value="2000" class="addon"> Roof Cleaning ($2,000)
</label>

<label class="addon-item">
<input type="checkbox" value="3000" class="addon"> Door Panel Cleaning ($3,000)
</label>

<label class="addon-item">
<input type="checkbox" value="2000" class="addon"> Center Console Cleaning ($2,000)
</label>

<label class="addon-item">
<input type="checkbox" value="2000" class="addon"> Odor Removal ($2,000)
</label>

<label class="addon-item">
<input type="checkbox" value="3000" class="addon"> Wheels & Rim Shine ($3,000)
</label>

</div>

<input type="date" name="date" id="date" required>

<select name="time" id="timeSlots">
<option>Select Time</option>
</select>

<div id="priceBox">
Total Price: $0
</div>

<button type="submit">Book Appointment</button>

</form>

<p id="message"></p>

</div>

<script src="script.js"></script>

</body>

</html>
