<!DOCTYPE html>
<html>

<head>
<title>Book Appointment</title>

<style>
body{
font-family:Arial;
background:#050b18;
padding:40px;
color:white;
}

.container{
max-width:500px;
margin:auto;
background:#0d1628;
padding:35px;
border-radius:12px;
}

.logo{
display:block;
margin:auto;
width:200px;
margin-bottom:10px;
}

h1{
text-align:center;
color:#00aaff;
}

input,select,button{
width:100%;
padding:12px;
margin-top:12px;
border-radius:6px;
border:none;
}

input,select{background:#f5f5f5;}

button{
background:#00aaff;
color:white;
font-weight:bold;
cursor:pointer;
}

#addons{
display:none;
margin-top:15px;
padding:10px;
background:#08101f;
border-radius:8px;
}

#priceBox{
margin-top:15px;
padding:10px;
background:#08101f;
color:#00ffaa;
text-align:center;
}

#message{
margin-top:10px;
text-align:center;
color:#00ffaa;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>Book Appointment</h1>

<form id="bookingForm">

<input type="text" name="name" placeholder="Full Name" required>
<input type="tel" name="phone" placeholder="Phone" required>
<input type="email" name="email" placeholder="Email" required>

<!-- DATE FIRST -->
<input type="date" name="date" id="dateInput" required>

<select name="service" id="service" required>
<option value="">Select Service</option>
<option value="Express Clean">Express Clean</option>
<option value="Premium Clean">Premium Clean</option>
<option value="Interior Deep Clean">Interior Deep Clean</option>
<option value="Platinum VIP Plan">Platinum VIP Plan</option>
<option value="Gold VIP Plan">Gold VIP Plan</option>
</select>

<select name="vehicle" id="vehicle">
<option value="Sedan">Sedan</option>
<option value="SUV">SUV</option>
<option value="Pickup/Van/Mini Bus">Pickup/Van/Mini Bus</option>
</select>

<div id="addons">
<h3>Add-ons</h3>
<label><input type="checkbox" class="addon" value="Roof Cleaning"> Roof Cleaning</label><br>
<label><input type="checkbox" class="addon" value="Floor Cleaning"> Floor Cleaning</label><br>
<label><input type="checkbox" class="addon" value="Odor Removal"> Odor Removal</label>
</div>

<select name="time" id="timeSlots" required>
<option value="">Select Time</option>
</select>

<div id="priceBox">Total Price: $0</div>

<button type="submit">Book Appointment</button>

</form>

<p id="message"></p>

</div>

<script src="script.js"></script>

</body>
</html>
