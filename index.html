<!DOCTYPE html>
<html>

<head>

<title>Book Appointment</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<img src="logoo.png" class="logo">

<h1>Book Appointment</h1>

<form id="bookingForm">

<input type="text" name="name" placeholder="Full Name" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<input type="email" name="email" placeholder="Email" required>

<select name="service" id="service" required>

<option value="">Select Service</option>
<option value="3000">Basic Exterior Services</option>
<option value="3500">Basic Interior Services</option>
<option value="5000">Express Clean Tier 1</option>
<option value="8000">Deep Clean Tier 2</option>
<option value="12000">Premium Clean Tier 3</option>
<option value="20000">Platinum VIP Plan</option>
<option value="15000">Gold VIP Plan</option>

</select>

<select name="vehicle" id="vehicle">

<option value="0">Sedan</option>
<option value="1000">SUV (+$1000)</option>
<option value="2000">Pickup/Van (+$2000)</option>

</select>

<div id="addons">

<h3>Optional Add-ons</h3>

<div class="addon-item">
<label>
<input type="checkbox" class="addon" value="2000">
<span>Roof Cleaning</span>
</label>
<span class="price">$2000</span>
</div>

<div class="addon-item">
<label>
<input type="checkbox" class="addon" value="3000">
<span>Door Panel Cleaning</span>
</label>
<span class="price">$3000</span>
</div>

<div class="addon-item">
<label>
<input type="checkbox" class="addon" value="6000">
<span>Seat & Belt Cleaning</span>
</label>
<span class="price">$6000</span>
</div>

<div class="addon-item">
<label>
<input type="checkbox" class="addon" value="2000">
<span>Odor Removal</span>
</label>
<span class="price">$2000</span>
</div>

<div class="addon-item">
<label>
<input type="checkbox" class="addon" value="3000">
<span>Rim Shine</span>
</label>
<span class="price">$3000</span>
</div>

</div>

<select name="time" id="timeSlots" required>
<option value="">Select Time</option>
<option>9:00 AM</option>
<option>11:00 AM</option>
<option>1:00 PM</option>
<option>3:00 PM</option>
<option>5:00 PM</option>
</select>

<input type="date" name="date" required>

<div id="priceBox">
Total Price: $0
</div>

<button type="submit">Book Appointment</button>

</form>

<p id="message"></p>

</div>

<script src="script.js"></script>

</body>

</html>
